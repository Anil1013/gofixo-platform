org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 default new DSL is incompatible with Flutter 3.47's current Gradle plugin.
# Keep the legacy DSL enabled until the Flutter Gradle plugin fully migrates.
android.newDsl=false
# Built-in Kotlin remains enabled; Mappls GL 2.0.7 is patched in settings.gradle.kts.
android.builtInKotlin=true
