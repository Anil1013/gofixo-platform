name: Gofixo Base Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/version.json'
      - 'mobile/lib/update_service.dart'
      - 'mobile/pubspec.yaml'
      - 'mobile/android/**'
      - '.github/workflows/gofixo-base-release.yml'

permissions:
  contents: write

concurrency:
  group: gofixo-base-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          BUILD="$(python3 -c 'import json; print(json.load(open("version.json"))["buildNumber"])')"
          test -n "$VERSION"
          test "$BUILD" -gt 0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "v${{ steps.version.outputs.version }}"
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.existing.outputs.exists != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Get dependencies
        if: steps.existing.outputs.exists != 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.existing.outputs.exists != 'true'
        run: flutter analyze --no-fatal-infos

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: flutter test

      - name: Configure release signing
        if: steps.existing.outputs.exists != 'true'
        env:
          GOFIXO_KEYSTORE_B64: ${{ secrets.GOFIXO_KEYSTORE_B64 }}
          GOFIXO_STORE_PASSWORD: ${{ secrets.GOFIXO_STORE_PASSWORD }}
          GOFIXO_KEY_PASSWORD: ${{ secrets.GOFIXO_KEY_PASSWORD }}
          GOFIXO_KEY_ALIAS: ${{ secrets.GOFIXO_KEY_ALIAS }}
        run: |
          set -euo pipefail

          for name in GOFIXO_KEYSTORE_B64 GOFIXO_STORE_PASSWORD GOFIXO_KEY_PASSWORD GOFIXO_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::GitHub Actions secret $name is not configured."
              echo "Add the four Gofixo signing secrets in Settings > Secrets and variables > Actions, then run this workflow again."
              exit 1
            fi
          done

          echo "$GOFIXO_KEYSTORE_B64" | base64 --decode > android/gofixo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$GOFIXO_STORE_PASSWORD
          keyPassword=$GOFIXO_KEY_PASSWORD
          keyAlias=$GOFIXO_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/mobile/android/gofixo-release.jks
          EOF
          chmod 600 android/gofixo-release.jks android/key.properties

          keytool -list -keystore android/gofixo-release.jks             -storepass "$GOFIXO_STORE_PASSWORD"             -alias "$GOFIXO_KEY_ALIAS" >/dev/null

      - name: Build release APK
        env:
          GOFIXO_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        if: steps.existing.outputs.exists != 'true'
        run: |
          flutter build apk --release             --build-name "${{ steps.version.outputs.version }}"             --build-number "${{ steps.version.outputs.build }}"

      - name: Verify APK signing and identity
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/build-tools" ]; then
            echo "::error title=Android SDK not found::ANDROID_SDK_ROOT/ANDROID_HOME is not pointing to an Android SDK."
            exit 1
          fi

          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APK_SIGNER" ] || [ ! -x "$APK_SIGNER" ]; then
            echo "::error title=apksigner not found::Could not locate apksigner under Android SDK build-tools."
            find "$SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print || true
            exit 1
          fi

          echo "Using apksigner: $APK_SIGNER"
          "$APK_SIGNER" verify --verbose "$APK"

          echo "APK signing certificate:"
          "$APK_SIGNER" verify --print-certs "$APK"

      - name: Create release manifest
        if: steps.existing.outputs.exists != 'true'
        run: |
          cat > build/app/outputs/flutter-apk/gofixo-version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "buildNumber": ${{ steps.version.outputs.build }},
            "downloadUrl": "https://github.com/Anil1013/gofixo-platform/releases/download/v${{ steps.version.outputs.version }}/gofixo-release.apk",
            "notes": "OTA-enabled Gofixo Android base release.",
            "forceUpdate": false
          }
          EOF

      - name: Publish release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/gofixo-release.apk
          gh release create "v${{ steps.version.outputs.version }}"             build/app/outputs/flutter-apk/gofixo-release.apk             build/app/outputs/flutter-apk/gofixo-version.json             --repo "$GITHUB_REPOSITORY"             --title "Gofixo v${{ steps.version.outputs.version }}"             --notes "OTA-enabled Gofixo Android base release."

      - name: Finish
        if: steps.existing.outputs.exists == 'true'
        run: echo "Base release v${{ steps.version.outputs.version }} already exists; nothing to do."
