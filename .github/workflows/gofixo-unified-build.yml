name: Gofixo Unified Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gofixo-unified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-app:
    name: Customer Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: gofixo-web-${{ github.sha }}
          path: app/dist
          if-no-files-found: error
          retention-days: 7

  admin-web:
    name: Admin Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        working-directory: admin
        run: npm ci
      - name: Lint
        working-directory: admin
        run: npm run lint
      - name: Build
        working-directory: admin
        run: npm run build
      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: gofixo-admin-${{ github.sha }}
          path: admin/dist
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Android App Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          BUILD="$(python3 -c 'import json; print(json.load(open("version.json"))["buildNumber"])')"
          test -n "$VERSION"
          test "$BUILD" -gt 0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Configure persistent Android signing
        env:
          GOFIXO_KEYSTORE_B64: ${{ secrets.GOFIXO_KEYSTORE_B64 }}
          GOFIXO_STORE_PASSWORD: ${{ secrets.GOFIXO_STORE_PASSWORD }}
          GOFIXO_KEY_PASSWORD: ${{ secrets.GOFIXO_KEY_PASSWORD }}
          GOFIXO_KEY_ALIAS: ${{ secrets.GOFIXO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$GOFIXO_KEYSTORE_B64"
          test -n "$GOFIXO_STORE_PASSWORD"
          test -n "$GOFIXO_KEY_PASSWORD"
          test -n "$GOFIXO_KEY_ALIAS"
          printf '%s' "$GOFIXO_KEYSTORE_B64" | base64 --decode > android/gofixo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$GOFIXO_STORE_PASSWORD
          keyPassword=$GOFIXO_KEY_PASSWORD
          keyAlias=$GOFIXO_KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/mobile/android/gofixo-release.jks
          EOF
          chmod 600 android/gofixo-release.jks android/key.properties
          keytool -list -keystore android/gofixo-release.jks             -storepass "$GOFIXO_STORE_PASSWORD"             -alias "$GOFIXO_KEY_ALIAS" >/dev/null
      - name: Build release APK
        env:
          GOFIXO_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GOFIXO_GOOGLE_MAPS_API_KEY"
          flutter build apk --release             --build-name "${{ steps.version.outputs.version }}"             --build-number "${{ steps.version.outputs.build }}"             --dart-define=GOFIXO_GIT_SHA=${{ github.sha }}
      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          APK_SIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          test -x "$APK_SIGNER"
          echo "Using apksigner: $APK_SIGNER"
          "$APK_SIGNER" version

          # Verify against the app's actual minSdk instead of the host's default.
          # Keep diagnostics visible if verification fails so future CI failures are actionable.
          if ! "$APK_SIGNER" verify --verbose --min-sdk-version 24 "$APK"; then
            echo "::error::APK signature verification failed"
            "$APK_SIGNER" verify --print-certs "$APK" || true
            keytool -printcert -jarfile "$APK" || true
            exit 1
          fi

          "$APK_SIGNER" verify --print-certs "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gofixo-android-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: node --check server.js
      - name: Workflow summary
        run: |
          echo "Gofixo unified build passed for commit $GITHUB_SHA"
          echo "Customer web: built"
          echo "Admin web: built"
          echo "Android app: built and signing verified"
          echo "Backend: syntax validated"


  publish-android-release:
    name: Publish Android GitHub Release
    needs: mobile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("mobile/version.json"))["version"])')"
          BUILD="$(python3 -c 'import json; print(json.load(open("mobile/version.json"))["buildNumber"])')"
          test -n "$VERSION"
          test "$BUILD" -gt 0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: gofixo-android-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub Release and APK
        env:
          GH_TOKEN: \${{ github.token }}
          TAG: v\${{ steps.version.outputs.version }}
          VERSION: \${{ steps.version.outputs.version }}
          BUILD: \${{ steps.version.outputs.build }}
          APK: release-assets/app-release.apk
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK"
          mv "$APK" release-assets/gofixo-release.apk

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the published release unchanged."
          else
            gh release create "$TAG" release-assets/gofixo-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Gofixo $VERSION" \
              --generate-notes \
              --latest
            echo "Published $TAG with build $BUILD."
          fi
