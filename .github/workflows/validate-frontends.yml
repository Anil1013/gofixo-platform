name: Validate Frontends

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/validate-frontends.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/validate-frontends.yml'

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: npm run build
        working-directory: admin
