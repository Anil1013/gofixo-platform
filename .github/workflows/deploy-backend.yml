name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'config/**'
      - 'routes/**'
      - 'middleware/**'
      - 'services/**'
      - 'utils/**'
      - 'package.json'
      - 'ecosystem.config.cjs'
      - '.platform/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: GOOGLE_MAPS_API_KEY
          script: |
            set -euo pipefail

            cd /home/ubuntu/gofixo-platform

            # Use a dedicated deploy ref so stale/concurrent origin/main refs
            # cannot break the deployment with "incorrect old value provided".
            git fetch --no-tags origin main:refs/remotes/gofixo-deploy/main
            git reset --hard refs/remotes/gofixo-deploy/main

            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/gofixo-deploy/main)"
            test -f server.js

            # Keep private customer/provider uploads outside the Git checkout so
            # deployments and git resets cannot overwrite or remove user files.
            GOFIXO_UPLOAD_DIR="${GOFIXO_UPLOAD_DIR:-/home/ubuntu/gofixo-data/uploads}"
            mkdir -p "$GOFIXO_UPLOAD_DIR"
            chmod 700 "$(dirname "$GOFIXO_UPLOAD_DIR")" "$GOFIXO_UPLOAD_DIR"
            if [ -d uploads ] && [ -z "$(find "$GOFIXO_UPLOAD_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              cp -a uploads/. "$GOFIXO_UPLOAD_DIR"/
              echo "Migrated existing upload files to persistent storage."
            fi
            test -f ecosystem.config.cjs

            npm install --omit=dev

            # Apply the additive dynamic service catalog migration before restart.
            # The SQL is idempotent and preserves any catalog edits made by admins.
            NODE_ENV=production node <<'NODE'
            require('dotenv').config();
            const fs = require('node:fs');
            const { Client } = require('pg');
            (async () => {
              if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL is missing; cannot apply service catalog migration');
              const client = new Client({
                connectionString: process.env.DATABASE_URL,
                ssl: process.env.NODE_ENV === 'production' ? { rejectUnauthorized: false } : false,
              });
              await client.connect();
              try {
                await client.query('BEGIN');
                await client.query(fs.readFileSync('config/migration_016_dynamic_service_catalog.sql', 'utf8'));
                await client.query(fs.readFileSync('config/migration_017_service_quotes.sql', 'utf8'));
                await client.query('COMMIT');
                console.log('Dynamic service catalog migration 016 and Home Service quotes migration 017 applied.');
              } catch (error) {
                await client.query('ROLLBACK').catch(() => {});
                throw error;
              } finally {
                await client.end();
              }
            })().catch((error) => {
              console.error('Migration 016 failed:', error.message);
              process.exitCode = 1;
            });
            NODE

            test -n "${GOOGLE_MAPS_API_KEY:-}" || {
              echo "GOOGLE_MAPS_API_KEY is missing from the GitHub deployment environment."
              exit 1
            }

            # Persist the deployment secret for the backend and keep the file private.
            touch .env
            grep -v -E '^(GOOGLE_MAPS_API_KEY|GOFIXO_UPLOAD_DIR|CASHFREE_)' .env > .env.tmp || true
            printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" >> .env.tmp
            printf 'GOFIXO_UPLOAD_DIR=%s\n' "$GOFIXO_UPLOAD_DIR" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env

            # Export into the shell so PM2 receives the same environment.
            export GOOGLE_MAPS_API_KEY
            export GOFIXO_UPLOAD_DIR
            export GOFIXO_RELEASE_COMMIT="$(git rev-parse HEAD)"

            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save

            # Verify the actual running Node process has the key without printing it.
            PM2_PID="$(pm2 pid gofixo-backend | tr -d '[:space:]')"
            test -n "$PM2_PID" || {
              echo "PM2 did not return a PID for gofixo-backend."
              exit 1
            }

            tr '\0' '\n' < "/proc/$PM2_PID/environ" | grep -q '^GOOGLE_MAPS_API_KEY=.' || {
              echo "Running gofixo-backend process does not have GOOGLE_MAPS_API_KEY."
              exit 1
            }

            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:4000/ >/tmp/gofixo-root-health.json; then
                break
              fi
              sleep 2
            done

            curl -fsS --max-time 10 http://127.0.0.1:4000/ >/tmp/gofixo-root-health.json
            curl -fsS --max-time 10 http://127.0.0.1:4000/api/auth/health >/tmp/gofixo-auth-health.json
            curl -fsS --max-time 10 http://127.0.0.1:4000/api/health >/tmp/gofixo-api-health.json

            ROUTE_RESPONSE="$(curl -fsS --max-time 20 -X POST http://127.0.0.1:4000/api/routes/compute               -H 'Content-Type: application/json'               --data '{"origin":{"lat":28.4867,"lng":77.0866},"destination":{"lat":28.4595,"lng":77.0266}}')"

            echo "$ROUTE_RESPONSE" | grep -q '"distanceMeters"' || {
              echo "Google Routes smoke test failed:"
              echo "$ROUTE_RESPONSE"
              exit 1
            }

            echo "=== ROOT HEALTH ==="
            cat /tmp/gofixo-root-health.json
            echo
            echo "=== AUTH HEALTH ==="
            cat /tmp/gofixo-auth-health.json
            echo
            echo "=== API HEALTH ==="
            cat /tmp/gofixo-api-health.json
            echo
            echo "=== ROUTES HEALTH ==="
            echo "$ROUTE_RESPONSE"
            echo
            echo "=== PM2 ==="
            pm2 describe gofixo-backend | sed -n '1,80p'

      - name: Verify public API
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            code="$(curl -sS --max-time 10 -o /tmp/gofixo-public-health.json -w '%{http_code}' https://gofixo.mob13r.com/api/health || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/gofixo-public-health.json
              exit 0
            fi

            echo "Public health check attempt $i returned HTTP $code"
            cat /tmp/gofixo-public-health.json || true
            sleep 2
          done

          echo "Public API health check failed."
          exit 1
