name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'config/**'
      - 'routes/**'
      - 'middleware/**'
      - 'services/**'
      - 'utils/**'
      - 'package.json'
      - 'ecosystem.config.cjs'
      - '.platform/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          envs: GOOGLE_MAPS_API_KEY
          script: |
            set -euo pipefail

            cd /home/ubuntu/gofixo-platform

            # Do not update origin/main directly on the deploy host.
            # A concurrent/stale remote-tracking ref can make git fetch fail with
            # "incorrect old value provided". Fetch main into a dedicated deploy
            # ref and reset from that ref instead.
            git fetch --no-tags origin main:refs/remotes/gofixo-deploy/main
            git reset --hard refs/remotes/gofixo-deploy/main

            test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/gofixo-deploy/main)"
            test -f server.js
            test -f ecosystem.config.cjs

            npm install --omit=dev

            test -n "${GOOGLE_MAPS_API_KEY:-}" || {
              echo "GOOGLE_MAPS_API_KEY is missing from the GitHub deployment environment."
              exit 1
            }

            touch .env
            grep -v '^GOOGLE_MAPS_API_KEY=' .env > .env.tmp || true
            printf 'GOOGLE_MAPS_API_KEY=%s\n' "$GOOGLE_MAPS_API_KEY" >> .env.tmp
            mv .env.tmp .env
            chmod 600 .env

            export GOOGLE_MAPS_API_KEY
            export GOFIXO_RELEASE_COMMIT="$(git rev-parse HEAD)"

            pm2 startOrRestart ecosystem.config.cjs --update-env
            pm2 save

            PM2_KEY_STATUS="$(pm2 env 0 | grep '^GOOGLE_MAPS_API_KEY=' | sed 's/=.*/=SET/' || true)"
            test "$PM2_KEY_STATUS" = "GOOGLE_MAPS_API_KEY=SET" || {
              echo "PM2 did not receive GOOGLE_MAPS_API_KEY."
              exit 1
            }

            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:4000/ >/tmp/gofixo-root-health.json; then
                break
              fi
              sleep 2
            done

            curl -fsS --max-time 10 http://127.0.0.1:4000/ >/tmp/gofixo-root-health.json
            curl -fsS --max-time 10 http://127.0.0.1:4000/api/auth/health >/tmp/gofixo-auth-health.json
            curl -fsS --max-time 10 http://127.0.0.1:4000/api/health >/tmp/gofixo-api-health.json

            ROUTE_RESPONSE="$(curl -fsS --max-time 20 -X POST http://127.0.0.1:4000/api/routes/compute               -H 'Content-Type: application/json'               --data '{"origin":{"lat":28.4867,"lng":77.0866},"destination":{"lat":28.4595,"lng":77.0266}}')"

            echo "$ROUTE_RESPONSE" | grep -q '"distanceMeters"' || {
              echo "Google Routes smoke test failed:"
              echo "$ROUTE_RESPONSE"
              exit 1
            }

            echo "=== ROOT HEALTH ==="
            cat /tmp/gofixo-root-health.json
            echo
            echo "=== AUTH HEALTH ==="
            cat /tmp/gofixo-auth-health.json
            echo
            echo "=== API HEALTH ==="
            cat /tmp/gofixo-api-health.json
            echo
            echo "=== ROUTES HEALTH ==="
            echo "$ROUTE_RESPONSE"
            echo
            echo "=== PM2 ==="
            pm2 describe gofixo-backend | sed -n '1,80p'

      - name: Verify public API
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            code="$(curl -sS --max-time 10 -o /tmp/gofixo-public-health.json -w '%{http_code}' https://gofixo.mob13r.com/api/health || true)"
            if [ "$code" = "200" ]; then
              cat /tmp/gofixo-public-health.json
              exit 0
            fi

            echo "Public health check attempt $i returned HTTP $code"
            cat /tmp/gofixo-public-health.json || true
            sleep 2
          done

          echo "Public API health check failed."
          exit 1
