name: Publish Gofixo APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure Gradle memory for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          lines = p.read_text().splitlines()
          key = "org.gradle.jvmargs="
          replacement = "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -Dfile.encoding=UTF-8"
          found = False
          out = []
          for line in lines:
              if line.startswith(key):
                  if not found:
                      out.append(replacement)
                      found = True
              else:
                  out.append(line)
          if not found:
              out.insert(0, replacement)
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/gofixo-release.apk

      - name: Publish APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            mobile/build/app/outputs/flutter-apk/gofixo-release.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gofixo ${GITHUB_REF_NAME}" \
            --notes "Gofixo Android APK release."
