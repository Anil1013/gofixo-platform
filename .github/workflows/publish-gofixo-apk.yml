name: Publish Gofixo APK

on:
  push:
    tags:
      - "v*"
    paths:
      - "mobile/version.json"
      - "mobile/lib/update_service.dart"
      - "mobile/android/**"
      - "mobile/pubspec.yaml"
      - ".github/workflows/publish-gofixo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Configure Gradle memory for CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/gradle.properties")
          lines = p.read_text().splitlines()
          key = "org.gradle.jvmargs="
          replacement = "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -Dfile.encoding=UTF-8"
          found = False
          out = []
          for line in lines:
              if line.startswith(key):
                  if not found:
                      out.append(replacement)
                      found = True
              else:
                  out.append(line)
          if not found:
              out.insert(0, replacement)
          p.write_text("\n".join(out) + "\n")
          PY

      - name: Configure release signing
        env:
          GOFIXO_KEYSTORE_B64: ${{ secrets.GOFIXO_KEYSTORE_B64 }}
          GOFIXO_STORE_PASSWORD: ${{ secrets.GOFIXO_STORE_PASSWORD }}
          GOFIXO_KEY_PASSWORD: ${{ secrets.GOFIXO_KEY_PASSWORD }}
          GOFIXO_KEY_ALIAS: ${{ secrets.GOFIXO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$GOFIXO_KEYSTORE_B64"
          test -n "$GOFIXO_STORE_PASSWORD"
          test -n "$GOFIXO_KEY_PASSWORD"
          test -n "$GOFIXO_KEY_ALIAS"

          echo "$GOFIXO_KEYSTORE_B64" | base64 --decode > android/gofixo-release.jks
          cat > android/key.properties <<EOF
          storePassword=$GOFIXO_STORE_PASSWORD
          keyPassword=$GOFIXO_KEY_PASSWORD
          keyAlias=$GOFIXO_KEY_ALIAS
          storeFile=${GITHUB_WORKSPACE}/mobile/android/gofixo-release.jks
          EOF
          chmod 600 android/gofixo-release.jks android/key.properties

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            BASE="${VERSION%%-*}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            : "${MAJOR:=0}" "${MINOR:=0}" "${PATCH:=0}"
            BUILD_NUMBER=$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))
          else
            VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
            BUILD_NUMBER="$(python3 -c 'import json; print(json.load(open("version.json"))["buildNumber"])')"
          fi

          test -n "$VERSION"
          test "$BUILD_NUMBER" -gt 0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION ($BUILD_NUMBER)"

      - name: Build release APK
        run: flutter build apk --release --build-name "${{ steps.version.outputs.version }}" --build-number "${{ steps.version.outputs.build_number }}"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" build/app/outputs/flutter-apk/gofixo-release.apk
          ls -lh build/app/outputs/flutter-apk/gofixo-release.apk

      - name: Verify APK signing
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/gofixo-release.apk"
          APK_SIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -x "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --min-sdk-version 24 "$APK"
          "$APK_SIGNER" verify --print-certs "$APK"

      - name: Create update manifest
        run: |
          cat > build/app/outputs/flutter-apk/gofixo-version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "buildNumber": ${{ steps.version.outputs.build_number }},
            "downloadUrl": "https://github.com/Anil1013/gofixo-platform/releases/latest/download/gofixo-release.apk",
            "notes": "Reliable in-app APK download and Android installer flow.",
            "forceUpdate": true
          }
          EOF
          cat build/app/outputs/flutter-apk/gofixo-version.json

      - name: Publish APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"

          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" \
            mobile/build/app/outputs/flutter-apk/gofixo-release.apk \
            mobile/build/app/outputs/flutter-apk/gofixo-version.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gofixo ${TAG}" \
            --notes "Gofixo Android APK release."
