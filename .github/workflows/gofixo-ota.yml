name: Gofixo OTA

on:
  push:
    branches: [main]
    paths:
      - 'mobile/lib/**'
      - 'mobile/assets/**'
      - 'mobile/pubspec.yaml'
      - 'mobile/version.json'
      - 'mobile/test/**'
      - '.github/workflows/gofixo-ota.yml'

permissions:
  contents: read

concurrency:
  group: gofixo-ota-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: gofixo-android-ndk-${{ runner.os }}-flutter-3.47.6

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Read OTA base version
        id: base
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("version.json"))["version"])')"
          BUILD="$(python3 -c 'import json; print(json.load(open("version.json"))["buildNumber"])')"
          test -n "$VERSION"
          test "$BUILD" -gt 0
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      - name: Configure persistent Android signing
        shell: bash
        env:
          GOFIXO_KEYSTORE_B64: ${{ secrets.GOFIXO_KEYSTORE_B64 }}
          GOFIXO_STORE_PASSWORD: ${{ secrets.GOFIXO_STORE_PASSWORD }}
          GOFIXO_KEY_PASSWORD: ${{ secrets.GOFIXO_KEY_PASSWORD }}
          GOFIXO_KEY_ALIAS: ${{ secrets.GOFIXO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$GOFIXO_KEYSTORE_B64"
          test -n "$GOFIXO_STORE_PASSWORD"
          test -n "$GOFIXO_KEY_PASSWORD"
          test -n "$GOFIXO_KEY_ALIAS"

          printf '%s' "$GOFIXO_KEYSTORE_B64" | base64 --decode > android/gofixo-release.jks

          cat > android/key.properties <<EOF
          storePassword=$GOFIXO_STORE_PASSWORD
          keyPassword=$GOFIXO_KEY_PASSWORD
          keyAlias=$GOFIXO_KEY_ALIAS
          storeFile=../gofixo-release.jks
          EOF

          chmod 600 android/gofixo-release.jks android/key.properties
          keytool -list -v             -keystore android/gofixo-release.jks             -storepass "$GOFIXO_STORE_PASSWORD"             -alias "$GOFIXO_KEY_ALIAS"             | grep -E 'Alias name:|SHA256:' | head -2

      - name: Build OTA base APK
        env:
          GOFIXO_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=true -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2 -Dorg.gradle.caching=true'
        run: |
          flutter build apk --release \
            --build-name "${{ steps.base.outputs.version }}" \
            --build-number "${{ steps.base.outputs.build }}" \
            --dart-define=GOFIXO_GIT_SHA=${{ github.sha }}
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/gofixo-current-release.apk

      - name: Build OTA patch
        env:
          PATCH_VERSION: "ota-${{ github.sha }}"
          TARGET_VERSION_CODE: "${{ steps.base.outputs.build }}"
        run: |
          set -euo pipefail
          rm -rf dist
          dart run flutter_ota_kit:pack             --apk build/app/outputs/flutter-apk/app-release.apk             --version "$PATCH_VERSION"             --target-version-code "$TARGET_VERSION_CODE"             --out dist
          test -s dist/patch.zip
          test -s dist/manifest.json
          cp dist/patch.zip "dist/patch-$GITHUB_SHA.zip"

      - name: Create server manifest
        env:
          PATCH_VERSION: "ota-${{ github.sha }}"
          TARGET_VERSION_CODE: "${{ steps.base.outputs.build }}"
        run: |
          set -euo pipefail
          MD5="$(md5sum "dist/patch-$GITHUB_SHA.zip" | awk '{print $1}')"
          export MD5
          python3 - <<'PY'
          import json, os
          manifest = {
            "schemaVersion": 1,
            "gitCommitHash": os.environ["GITHUB_SHA"],
            "message": "Automatic Gofixo OTA update",
            "patches": {}
          }
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
            manifest["patches"][abi] = {
              "version": os.environ["PATCH_VERSION"],
              "filename": f"patch-{os.environ['GITHUB_SHA']}.zip",
              "md5": os.environ["MD5"],
              "signature": "",
              "targetVersionCode": int(os.environ["TARGET_VERSION_CODE"])
            }
          open("dist/latest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY
          cat dist/latest.json

      - name: Build 1.0.4 migration patch
        env:
          LEGACY_PATCH_VERSION: "migrate-1000004-${{ github.sha }}"
        run: |
          set -euo pipefail
          rm -rf legacy-dist
          flutter build apk --release \
            --build-name "1.0.4" \
            --build-number "1000004" \
            --dart-define=GOFIXO_GIT_SHA=${{ github.sha }}
          ASSET_KEYS="$(find assets/illustrations -type f | sort | paste -sd, -)"
          test -n "$ASSET_KEYS"
          echo "Migration asset keys: $ASSET_KEYS"
          dart run flutter_ota_kit:pack \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --version "$LEGACY_PATCH_VERSION" \
            --target-version-code "1000004" \
            --assets "$ASSET_KEYS" \
            --out legacy-dist
          test -s legacy-dist/patch.zip
          test -s legacy-dist/manifest.json
          cp legacy-dist/patch.zip "legacy-dist/patch-1000004-${{ github.sha }}.zip"
          MD5="$(md5sum "legacy-dist/patch-1000004-${{ github.sha }}.zip" | awk '{print $1}')"
          export MD5 LEGACY_PATCH_VERSION
          python3 - <<'PY'
          import json, os
          manifest = {
            "schemaVersion": 1,
            "gitCommitHash": os.environ["GITHUB_SHA"],
            "message": "Gofixo 1.0.4 migration update",
            "patches": {}
          }
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64"):
            manifest["patches"][abi] = {
              "version": os.environ["LEGACY_PATCH_VERSION"],
              "filename": f"patch-1000004-{os.environ['GITHUB_SHA']}.zip",
              "md5": os.environ["MD5"],
              "signature": "",
              "targetVersionCode": 1000004
            }
          open("legacy-dist/legacy-1000004.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY
          cp /tmp/gofixo-current-release.apk build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare OTA upload
        run: |
          set -euo pipefail
          mkdir -p ota-upload
          cp "dist/patch-$GITHUB_SHA.zip" ota-upload/
          cp dist/latest.json ota-upload/
          cp "legacy-dist/patch-1000004-$GITHUB_SHA.zip" ota-upload/
          cp legacy-dist/legacy-1000004.json ota-upload/
          ls -lh ota-upload

      - name: Upload OTA payload to Gofixo EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mobile/ota-upload/latest.json,mobile/ota-upload/patch-${{ github.sha }}.zip,mobile/ota-upload/legacy-1000004.json,mobile/ota-upload/patch-1000004-${{ github.sha }}.zip"
          target: "/home/ubuntu/gofixo-platform/ota/"
          strip_components: 2
          overwrite: true

      - name: Publish versioned APK and download link
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "mobile/build/app/outputs/flutter-apk/app-release.apk"
          target: "/home/ubuntu/gofixo-platform/public-apk/"
          strip_components: 5
          overwrite: true

      - name: Configure public APK download
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_VERSION: "${{ steps.base.outputs.version }}"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          envs: APP_VERSION
          script: |
            set -euo pipefail
            APK_DIR="/home/ubuntu/gofixo-platform/public-apk"
            APK="$APK_DIR/app-release.apk"
            VERSIONED="$APK_DIR/gofixo-release-v$APP_VERSION.apk"

            test -s "$APK"
            mv -f "$APK" "$VERSIONED"
            ln -sfn "$(basename "$VERSIONED")" "$APK_DIR/gofixo-release-latest.apk"

            sudo python3 - <<'PY'
            from pathlib import Path
            p = Path("/etc/nginx/sites-enabled/gofixo")
            s = p.read_text()
            marker = "location /download/ {"
            block = """location /download/ {
                alias /home/ubuntu/gofixo-platform/public-apk/;
                default_type application/vnd.android.package-archive;
                add_header Content-Disposition 'attachment';
            }

            """
            if marker not in s:
                s = s.replace("    location / {", "    " + block + "    location / {", 1)

            legacy_marker = "location ~ ^/releases/download/v"
            legacy_block = """location ~ ^/releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/gofixo-release\\.apk$ {
                rewrite ^/releases/download/v([0-9]+\\.[0-9]+\\.[0-9]+)/gofixo-release\\.apk$ /download/gofixo-release-v$1.apk redirect;
            }

            """
            if legacy_marker not in s:
                s = s.replace("    location / {", "    " + legacy_block + "    location / {", 1)

            p.write_text(s)
            PY

            sudo nginx -t
            sudo systemctl reload nginx

            echo "APK_LINK=https://gofixo.mob13r.com/download/gofixo-release-v$APP_VERSION.apk"
            echo "LATEST_APK_LINK=https://gofixo.mob13r.com/download/gofixo-release-latest.apk"

      - name: Verify OTA endpoint
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eo pipefail

            OTA_DIR="/home/ubuntu/gofixo-platform/ota"
            MANIFEST="$OTA_DIR/latest.json"
            PATCH_FILE="$OTA_DIR/patch-${{ github.sha }}.zip"

            echo "=== OTA FILES ==="
            ls -lah "$OTA_DIR"

            test -s "$MANIFEST"
            test -s "$PATCH_FILE"
            python3 -m json.tool "$MANIFEST" >/dev/null

            echo "=== OTA MANIFEST ==="
            cat "$MANIFEST"

            URL="http://127.0.0.1:4000/api/mobile/ota/check?app_version_code=${{ steps.base.outputs.build }}&abi=arm64-v8a"
            for attempt in $(seq 1 18); do
              HTTP_CODE="$(curl -sS --max-time 10 -o /tmp/gofixo-ota-check.json -w '%{http_code}' "$URL" || true)"
              BODY="$(cat /tmp/gofixo-ota-check.json 2>/dev/null || true)"
              echo "Attempt $attempt/18: HTTP $HTTP_CODE"
              echo "$BODY"

              if [ "$HTTP_CODE" = "200" ] && python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("hasUpdate") is True' <<<"$BODY"; then
                echo "Current OTA endpoint verification passed."
                break
              fi
              sleep 5
              if [ "$attempt" = "18" ]; then
                echo "ERROR: Current OTA endpoint verification failed."
                exit 1
              fi
            done

            LEGACY_URL="http://127.0.0.1:4000/api/mobile/ota/check?app_version_code=1000004&abi=arm64-v8a"
            for attempt in $(seq 1 18); do
              HTTP_CODE="$(curl -sS --max-time 10 -o /tmp/gofixo-ota-legacy-check.json -w '%{http_code}' "$LEGACY_URL" || true)"
              BODY="$(cat /tmp/gofixo-ota-legacy-check.json 2>/dev/null || true)"
              echo "Legacy attempt $attempt/18: HTTP $HTTP_CODE"
              echo "$BODY"

              if [ "$HTTP_CODE" = "200" ] && python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("hasUpdate") is True and d.get("patch",{}).get("targetVersionCode") == 1000004' <<<"$BODY"; then
                echo "Legacy 1.0.4 migration OTA verification passed."
                exit 0
              fi
              sleep 5
            done

            echo "ERROR: Legacy 1.0.4 migration OTA verification failed."
            exit 1
